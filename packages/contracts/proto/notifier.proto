syntax = "proto3";

package notifier;

import "common.proto";

// Service responsible for notifications and event-driven file delivery.
// Business logic runs through RabbitMQ event subscription — NotifierService
// gRPC surface exposes only HealthCheck (grpc-health-check protocol is
// registered independently via grpc-health-check package; see
// packages/foundation/src/external/grpc/grpc-server.factory.ts).
service NotifierService {
  rpc HealthCheck(common.Empty) returns (common.HealthStatus);
}
