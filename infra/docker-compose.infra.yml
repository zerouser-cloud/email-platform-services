services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-email_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [infra]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [infra]

  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [infra]

  garage:
    image: dxflrs/garage:v2.1.0
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET} # Phase 999.17.2 D-10 — native Garage v2 env override.
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/garage', '-c', '/etc/garage.toml', 'status']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      infra:
        # Network aliases so containers in the same network can resolve
        # `public.localhost` (and other bucket subdomains) to this Garage
        # instance — required for [s3_web] virtual-host routing in isolated
        # mode where apps run inside containers (not on host loopback).
        aliases:
          - public.localhost

  garage-webui:
    image: khairul169/garage-webui:1.1.0
    environment:
      API_BASE_URL: 'http://garage:3903'
      S3_ENDPOINT_URL: 'http://garage:3900'
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN}
      S3_REGION: garage
    depends_on:
      garage:
        condition: service_healthy
    restart: unless-stopped
    networks: [infra]

volumes:
  postgres_data:
  rabbitmq_data:
  garage_meta:
  garage_data:

networks:
  infra:
    driver: bridge
