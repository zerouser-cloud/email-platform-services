include:
  - docker-compose.infra.yml

services:
  gateway:
    build:
      context: ../
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP_NAME: gateway
    ports: ['4000:3000']
    env_file: ../.env.docker
    depends_on:
      auth:
        condition: service_healthy
      sender:
        condition: service_healthy
      parser:
        condition: service_healthy
      audience:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'wget', '-qO/dev/null', 'http://127.0.0.1:3000/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [services, infra]

  auth:
    build:
      context: ../
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP_NAME: auth
    expose: ['50051']
    env_file: ../.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'grpc_health_probe', '-addr=:50051']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [services, infra]

  sender:
    build:
      context: ../
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP_NAME: sender
    expose: ['50052']
    env_file: ../.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'grpc_health_probe', '-addr=:50052']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [services, infra]

  parser:
    build:
      context: ../
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP_NAME: parser
    expose: ['50053']
    env_file: ../.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'grpc_health_probe', '-addr=:50053']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [services, infra]

  audience:
    build:
      context: ../
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP_NAME: audience
    expose: ['50054']
    env_file: ../.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'grpc_health_probe', '-addr=:50054']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [services, infra]

  notifier:
    build:
      context: ../
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP_NAME: notifier
    expose: ['50055']
    env_file: ../.env.docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'grpc_health_probe', '-addr=:50055']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [services, infra]

networks:
  services:
    driver: bridge
