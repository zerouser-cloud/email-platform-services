# Garage v2.1.0 — minimal single-node local config.
# [s3_web] enables anonymous virtual-host download for the `public` bucket
# (Phase 22.4: bucket-as-subdomain via *.localhost — RFC 6761 auto-resolves to loopback).
# admin_token is NOT set here — Garage reads GARAGE_ADMIN_TOKEN env var instead, which is
# injected into the garage service via docker-compose (same token passed to garage-webui as
# API_ADMIN_KEY so both sides agree — see Pitfall 7).

metadata_dir = "/var/lib/garage/meta"
data_dir     = "/var/lib/garage/data"
db_engine    = "sqlite"
replication_factor = 1

rpc_bind_addr   = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret intentionally omitted — sourced from GARAGE_RPC_SECRET env var (12-Factor pattern).
# See Phase 999.17.2 D-10 + RESEARCH §Garage envsubst mechanism Q1.
# Native env-var override since Garage v0.8.2 (we're on v2.1.0).

[s3_api]
api_bind_addr = "[::]:3900"
s3_region     = "garage"

[s3_web]
bind_addr   = "[::]:3902"
root_domain = ".localhost"

[admin]
api_bind_addr = "[::]:3903"
