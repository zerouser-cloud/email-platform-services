# ===========================================
# Phase 999.18.3 — L4 Pipeline canonical (FR-12..FR-17 + FR-20).
# Source-of-truth = .gitlab-ci.yml (per CONTEXT FR-12 + memory project_gitlab_migration).
# Substitutability rule (FR-16): pipeline invokes ONLY `pnpm <script>` + `docker buildx` + `kubectl`.
# Branch protection (FR-15): main requires MR + passing pipeline (configured server-side в GitLab).
# ===========================================

stages:
  - security-fast # parallel-eligible, no build dep
  - generate-contracts # FR-12 Placement A pre-build (drift-check gate)
  - build # docker buildx multi-arch — 6 services in matrix
  - push # registry push (image tag = $CI_COMMIT_SHORT_SHA)
  - security-deep # container-config + container-cve + license + sbom (post-build)
  - verify # FR-18 — Wave 0 999.18.1 verifier suite
  - deploy # FR-13 + FR-20 — kubectl apply -k + verify:k8s-rollout

# ============================================================
# security-fast (parallel, fail-fast, no build dep) — FR-14
# ============================================================
secret-detection:
  stage: security-fast
  image: zricethezav/gitleaks:v8.30.1
  script:
    - gitleaks git --no-banner --redact
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

sast:
  stage: security-fast
  image: returntocorp/semgrep:1.50
  script:
    - semgrep scan --config p/typescript --config p/javascript --config p/nodejs --config p/owasp-top-ten --config p/r2c-security-audit --error
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

env-parity:
  stage: security-fast
  image: node:22-alpine
  before_script:
    - corepack enable && corepack prepare pnpm@11.0.0 --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run hygiene:env-parity
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

audit:
  stage: security-fast
  image: node:22-alpine
  before_script:
    - corepack enable && corepack prepare pnpm@11.0.0 --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run security:audit-if-changed
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pnpm-lock.yaml
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - pnpm-lock.yaml
  allow_failure: false

# ============================================================
# generate-contracts (FR-12 Placement A pre-build + drift-check)
# ============================================================
generate-contracts-drift-check:
  stage: generate-contracts
  image: node:22-alpine
  before_script:
    - corepack enable && corepack prepare pnpm@11.0.0 --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm generate:contracts
    - git diff --exit-code packages/contracts/src/generated/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

# ============================================================
# build — docker buildx multi-arch (FR-16 + FR-17)
# ============================================================
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  parallel:
    matrix:
      - SERVICE: [gateway, auth, sender, parser, audience, notifier]
  before_script:
    - apk add --no-cache nodejs npm git
    - corepack enable && corepack prepare pnpm@11.0.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm generate:contracts # FR-12 Placement A
    - git diff --exit-code packages/contracts/src/generated/
    - docker run --privileged --rm tonistiigi/binfmt --install all # FR-17 QEMU
    - docker buildx create --use
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker buildx build
      --platform linux/amd64,linux/arm64
      --build-arg APP_NAME=$SERVICE
      --build-arg BUILD_COMMIT=$CI_COMMIT_SHA
      --build-arg BUILD_BRANCH=$CI_COMMIT_REF_NAME
      --tag $CI_REGISTRY_IMAGE/email-platform-$SERVICE:$CI_COMMIT_SHORT_SHA
      --tag $CI_REGISTRY_IMAGE/email-platform-$SERVICE:$CI_COMMIT_REF_SLUG
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/email-platform-$SERVICE:cache
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/email-platform-$SERVICE:cache,mode=max
      --push
      -f infra/docker/app.Dockerfile .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ============================================================
# security-deep (post-build — container scans)
# ============================================================
container-config:
  stage: security-deep
  image: aquasec/trivy:0.50.4
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infra/docker/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

container-cve:
  stage: security-deep
  image: aquasec/trivy:0.50.4
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

license-scan:
  stage: security-deep
  image: aquasec/trivy:0.50.4
  script:
    - trivy fs --scanners license --license-full --exit-code 1 --severity UNKNOWN,HIGH,CRITICAL .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

sbom:
  stage: security-deep
  image: anchore/syft:v1.40
  script:
    - syft scan dir:. -o cyclonedx-json=sbom.cdx.json
  artifacts:
    paths:
      - sbom.cdx.json
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

# ============================================================
# verify (FR-18 — Wave 0 999.18.1 verifier suite)
# ============================================================
verify-image-determinism:
  stage: verify
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache bash nodejs npm
    - corepack enable && corepack prepare pnpm@11.0.0 --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm verify:image-determinism
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

verify-injection-extinct:
  stage: verify
  image: node:22-alpine
  before_script:
    - corepack enable && corepack prepare pnpm@11.0.0 --activate
  script:
    - pnpm verify:injection-extinct
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

verify-multiarch:
  stage: verify
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache bash
  script:
    - pnpm verify:multiarch
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

verify-per-service-smoke:
  stage: verify
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache bash nodejs npm curl
    - corepack enable && corepack prepare pnpm@11.0.0 --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm verify:per-service-smoke
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false

# ============================================================
# deploy (FR-13 + FR-20 — Kustomize + rollout gate)
# ============================================================
deploy-dev:
  stage: deploy
  image: bitnami/kubectl:1.30
  before_script:
    - apk add --no-cache bash
  script:
    - kubectl apply -k deploy/k8s/overlays/dev/
    - pnpm verify:k8s-rollout # FR-20 — kubectl rollout status + readiness probe
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  environment:
    name: dev
  allow_failure: false

deploy-prod:
  stage: deploy
  image: bitnami/kubectl:1.30
  before_script:
    - apk add --no-cache bash nodejs npm
    - corepack enable && corepack prepare pnpm@11.0.0 --activate
  script:
    - kubectl apply -k deploy/k8s/overlays/prod/
    - pnpm verify:k8s-rollout
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual # FR-15 — main = manual gate after MR merge
  environment:
    name: prod
  allow_failure: false
