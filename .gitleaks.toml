# Phase 999.17 — gitleaks config (extends default rules; no project-specific allowlist).
# See .planning/phases/999.17-devsecops-shift-left-security-tooling/.
#
# Phase 999.17-12 (2026-04-29 amendment): the original [allowlist].paths regex
# `(.*?)(jpg|gif|doc|pdf|bin|svg|socket)` was unanchored and matched real source
# files (apps/auth/src/documentation.ts, apps/sender/src/binary-helper.ts, etc.)
# as substrings, silently skipping them from secret scanning (CR-02).
# Removed entirely; gitleaks default config (`useDefault = true` below) already
# covers binary file types per gitleaks docs.
#
# This file extends gitleaks' default rules. Project-specific rules
# go below. The default config is comprehensive — only add rules that
# are unique to this codebase.
title = "Email Platform — gitleaks config"

[extend]
# Use the embedded default config + add the rules below.
useDefault = true

# Project-specific rules (none initially — add only if you discover
# a credential format unique to this codebase that the default misses).
# [[rules]]
# id = "project-internal-token"
# description = "Internal service token format"
# regex = '''project_[a-z0-9]{32}'''
# tags = ["internal-token"]

# ----------------------------------------------------------------------------
# Phase 999.17.2 D-05 — fixture path allowlist (test infrastructure exception).
# Industry-standard exception for security tooling self-tests. Anchored regex.
# See .planning/phases/999.17.2-.../999.17.2-CONTEXT.md D-05.
# ----------------------------------------------------------------------------
[[allowlists]]
description = "Test fixtures (security gate self-tests) — synthetic triggering-format secrets used to prove scanner detection works. Industry-standard exception for security tooling test infrastructure (cf. semgrep test framework, trivy testdata, gitleaks own tests/). Anchored regex; one well-known path; no other path-allowlists."
paths = ['''^scripts/security/fixtures/''']

# ----------------------------------------------------------------------------
# Phase 999.17.2 D-06 — manifest shape-and-scope allowlist (idiomatic gitleaks v8 pattern).
# NOT a path carve-out: discriminates by SHAPE of finding inside one specific file.
# Real AWS keys, JWTs, or PEM blocks in the same file STILL fire (default rules unaffected).
# See .planning/phases/999.17.2-.../999.17.2-CONTEXT.md D-06 + canonical README package-lock.json example.
# ----------------------------------------------------------------------------
[[allowlists]]
description = "GSD framework integrity manifest — ~280 SHA-256 file hashes. Suppresses findings ONLY when (1) located in this exact file AND (2) extracted secret shape is bare 64-char lowercase hex. Real AWS keys, JWTs, or PEM blocks in the same file still fire because their secret shapes don't satisfy the regex (default rules unaffected). Idiomatic gitleaks v8 pattern — see canonical package-lock.json example in gitleaks README. NOTE: empirical verification (Phase 999.17.2-01 Task 2) showed gitleaks v8.30.1 builds Match = '<key>: \"<hash>\"' (entire capture incl. prefix), so anchored ^[a-f0-9]{64}$ never satisfies regexTarget=\"match\". regexTarget=\"secret\" targets the extracted secret (bare hex) and works correctly. Per RESEARCH.md A5: 'if hashes still fire, swap to secret'."
condition = "AND"
paths = ['''^\.claude/gsd-file-manifest\.json$''']
regexes = ['''^[a-f0-9]{64}$''']
regexTarget = "secret"

