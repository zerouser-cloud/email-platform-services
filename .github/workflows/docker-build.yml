name: Docker Build & Push

on:
  push:
    branches: [dev, main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, auth, sender, parser, audience, notifier]
    steps:
      - uses: actions/checkout@v4

      # Pre-build contract generation setup (Placement A per ADR-001 §Decision (d) — F-12 V2 closure)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Pre-build contract generation (Placement A per ADR-001 §Decision (d))
      # Runs once per matrix shard before docker buildx; gen output baked into Docker context.
      # Sequencing: F-24 (Wave 1 — pnpm-lock.yaml in turbo.json tasks.generate.inputs) closure
      # MUST precede this step per RESEARCH §10.1 R-05 to prevent stale cache restoration.
      - name: Pre-build contract generation
        run: pnpm generate:contracts

      # Drift-check gate (per RESEARCH §7.3 + ADR-001 §Decision (d))
      # Exits non-zero IF generated outputs diverged from committed state, failing CI before docker build.
      - name: Drift-check gate
        run: git diff --exit-code packages/contracts/src/generated/

      # Multi-arch emulation setup (per ADR-001 implicit-fifth — F-08 closure)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/email-platform-${{ matrix.service }}
          tags: |
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev-latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/app.Dockerfile
          # Multi-arch build (per ADR-001 implicit-fifth — F-08 closure)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_NAME=${{ matrix.service }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Coolify
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/coolify-deploy
        with:
          token: ${{ secrets.COOLIFY_TOKEN }}
          host: ${{ secrets.COOLIFY_HOST }}
          uuid: ${{ github.ref == 'refs/heads/dev' && secrets.COOLIFY_UUID_DEV || secrets.COOLIFY_UUID_PROD }}
