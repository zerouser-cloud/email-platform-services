apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  labels:
    app.kubernetes.io/name: parser
    app.kubernetes.io/component: grpc-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parser
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: parser
          image: registry.example.com/email-platform-parser:latest
          ports:
            - name: grpc
              containerPort: 50053
              protocol: TCP
          envFrom:
            - configMapRef:
                name: email-platform-config
            - secretRef:
                name: email-platform-secrets
          readinessProbe:
            grpc:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            grpc:
              port: 50053
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: parser
spec:
  selector:
    app.kubernetes.io/name: parser
  ports:
    - name: grpc
      port: 50053
      targetPort: grpc
  type: ClusterIP
