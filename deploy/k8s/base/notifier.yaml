apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/component: rmq-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: notifier
          image: registry.example.com/email-platform-notifier:latest
          envFrom:
            - configMapRef:
                name: email-platform-config
            - secretRef:
                name: email-platform-secrets
          # No probe — RMQ consumer; healthiness verified via process liveness only.
          # K8s default liveness = process exit; sufficient for RMQ consumer pattern.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
# No Service object — notifier has no inbound port.
