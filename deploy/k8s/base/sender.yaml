apiVersion: apps/v1
kind: Deployment
metadata:
  name: sender
  labels:
    app.kubernetes.io/name: sender
    app.kubernetes.io/component: grpc-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sender
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sender
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: sender
          image: registry.example.com/email-platform-sender:latest
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
          envFrom:
            - configMapRef:
                name: email-platform-config
            - secretRef:
                name: email-platform-secrets
          readinessProbe:
            exec:
              command: ["/usr/local/bin/grpc_health_probe", "-addr=:50052"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/grpc_health_probe", "-addr=:50052"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sender
spec:
  selector:
    app.kubernetes.io/name: sender
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
  type: ClusterIP
